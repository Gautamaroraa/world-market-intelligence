name: Scheduled market research

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect, date, map and score evidence
        env:
          GDELT_MAX_RECORDS: "75"
          REQUEST_TIMEOUT: "25"
        run: python -m pipelines.run_research
      - run: python -m pipelines.validate_data
      - name: Save refreshed research data
        run: |
          if git diff --quiet -- public/data/dashboard.json; then
            echo "No material research update"
            exit 0
          fi
          git config user.name "market-intelligence-bot"
          git config user.email "market-intelligence-bot@users.noreply.github.com"
          git add public/data/dashboard.json
          git commit -m "data: refresh dated market intelligence"
          git push
